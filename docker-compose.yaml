version: '3.8'

services:
  # 1. 数据库容器（MongoDB）
  mongo-1:
    image: mongo:latest
    container_name: mongo-1
    restart: always
    ports:
      - "32768:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Hr85550780
      MONGO_INITDB_DATABASE: admin
    networks:
      - hr_network

  # 2. 对象存储容器（MinIO）
  minio-1:
    image: minio/minio:latest
    container_name: minio-1
    restart: always
    ports:
      - "9000:9000"                      # API 端口
      - "9001:9001"                      # Web 控制台端口
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Hrbg@85550780
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    networks:
      - hr_network

  # 3. 后端容器（FastAPI）
  hr-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hr-backend
    restart: always
    ports:
      - "9080:9080"
    environment:
      # MongoDB 连接（容器内网）
      MONGO_URL: "mongodb://admin:Hr85550780@mongo-1:27017/?authSource=admin"
      # MinIO 连接（容器内网）
      MINIO_URL: "minio-1:9000"
    depends_on:
      - mongo-1
      - minio-1
    networks:
      - hr_network

  # 4. 前端容器（Vue + Nginx）
  hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hrcontract-frontend
    restart: always
    ports:
      - "3980:80"
    depends_on:
      - hr-backend
    networks:
      - hr_network

networks:
  hr_network:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
